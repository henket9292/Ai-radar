name: Build AI Trading APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project files
        run: |
          echo '{"name":"ai-trading","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.aitrading.radar","appName":"AI Trading","webDir":".","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android
        run: npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
