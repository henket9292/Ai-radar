name: Build AI Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Android app
        run: |
          mkdir apk-project
          cd apk-project
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          mkdir www
          echo '<html><body></body></html>' > www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.airadar.trading",
            "appName": "AI Radar",
            "webDir": "www",
            "server": {
              "url": "https://regal-nasturtium-72dbc0.netlify.app",
              "cleartext": false
            }
          }
          EOF

          npx cap add android
          npx cap sync android
        
      - name: Build APK
        run: |
          cd apk-project/android
          echo "allprojects {
            configurations.all {
              resolutionStrategy.eachDependency {
                if (it.requested.group == 'org.jetbrains.kotlin') {
                  it.useVersion '1.8.22'
                }
              }
            }
          }" > kotlin-fix.gradle
          ./gradlew -I kotlin-fix.gradle assembleDebug
